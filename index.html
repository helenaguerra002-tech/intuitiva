<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Better</title>
<meta name="description" content="Helena's private fitness and food companion until 31 December 2026.">
<meta name="theme-color" content="#faf6ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Better">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<div id="app">
  <section class="view on" id="view-home" aria-label="Home"></section>
  <section class="view" id="view-meals" aria-label="Meals"></section>
  <section class="view" id="view-train" aria-label="Train"></section>
  <section class="view" id="view-urges" aria-label="Urges"></section>
  <section class="view" id="view-more" aria-label="More"></section>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button class="tab on" data-v="home" onclick="go('home')" aria-label="Home">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>Home</button>
  <button class="tab" data-v="meals" onclick="go('meals')" aria-label="Meals">
    <svg viewBox="0 0 24 24"><path d="M4 12h16a8 8 0 0 1-16 0Z"/><path d="M8 12V6M12 12V5M16 12V7"/></svg>Meals</button>
  <button class="tab" data-v="train" onclick="go('train')" aria-label="Train">
    <svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
  <button class="tab" data-v="urges" onclick="go('urges')" aria-label="Urges">
    <svg viewBox="0 0 24 24"><path d="M2 15c3-5 6-5 9 0s6 5 9 0"/><path d="M2 9c3-5 6-5 9 0s6 5 9 0" opacity=".5"/></svg>Urges</button>
  <button class="tab" data-v="more" onclick="go('more')" aria-label="More">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>More</button>
</div></nav>

<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="image/*" class="hidden">
<input type="file" id="fileInMulti" accept="image/*" multiple class="hidden">
<input type="file" id="fileJson" accept="application/json,.json" class="hidden">

<script src="js/util.js?v=3"></script>
<script src="js/data.js?v=3"></script>
<script src="js/runs.js?v=3"></script>
<script src="js/yearmap.js?v=3"></script>
<script src="js/wins.js?v=3"></script>
<script src="js/learn.js?v=3"></script>
<script src="js/views/home.js?v=3"></script>
<script src="js/views/meals.js?v=3"></script>
<script src="js/views/train.js?v=3"></script>
<script src="js/views/urges.js?v=3"></script>
<script src="js/views/more.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
